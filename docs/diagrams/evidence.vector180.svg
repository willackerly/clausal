  <rect id="evidence.bounded.box" data-vector180-role="shape" data-vector180-export="native" x="984" y="160" width="280" height="400" fill="#efe9f8" stroke="#6a4aa3" stroke-width="3"/>
  <text id="evidence.bounded.title" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="1002 178 244 40" data-vector180-line-step="40" x="1002" y="207" fill="#17211e" stroke="none" font-family="ABeeZee" font-size="27" font-weight="400" font-style="normal" text-anchor="start">Bounded check</text>
  <text id="evidence.bounded.cover" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="1002 222 244 27" data-vector180-line-step="27" x="1002" y="241" fill="#6a4aa3" stroke="none" font-family="ABeeZee" font-size="18" font-weight="400" font-style="normal" text-anchor="start">every case up to a size</text>
  <text id="evidence.bounded.body.l1" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="1002 278 244 28" data-vector180-line-step="28" x="1002" y="298" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">Exhaustive over all</text>
  <text id="evidence.bounded.body.l2" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="1002 308 244 28" data-vector180-line-step="28" x="1002" y="328" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">values within a stated</text>
  <text id="evidence.bounded.body.l3" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="1002 338 244 28" data-vector180-line-step="28" x="1002" y="358" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">bound, on the real</text>
  <text id="evidence.bounded.body.l4" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="1002 368 244 28" data-vector180-line-step="28" x="1002" y="388" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">Rust. Bound is printed.</text>
