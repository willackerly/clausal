  <text id="evidence.title" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="40 28 1500 51" data-vector180-line-step="51" x="40" y="64" fill="#17211e" stroke="none" font-family="ABeeZee" font-size="34" font-weight="400" font-style="normal" text-anchor="start">One compiled rule, four kinds of evidence</text>
  <text id="evidence.subtitle" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="40 80 1500 33" data-vector180-line-step="33" x="40" y="103" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="22" font-weight="400" font-style="normal" text-anchor="start">Cheap evidence finds mistakes quickly. Proof is the only kind that covers every input and every size.</text>
