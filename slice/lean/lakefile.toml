name = "slice"
defaultTargets = ["Generated", "Bdd", "Ledger", "Wallet"]

# The Aeneas Lean support library, exactly as shipped inside the release
# tarball that also contains the `aeneas`/`charon` binaries we run
# (nightly-2026.11.09-5a392f4). Fetched by ../translate.sh --setup.
[[require]]
name = "aeneas"
path = "../.tools/aeneas-nightly-2026.11.09-5a392f4/backends/lean"

# Machine-generated by Aeneas from ../wallet. Never edit by hand.   (tool-trusted)
[[lean_lib]]
name = "Generated"
globs = ["Generated.+"]

# Fixed support: bridge lemmas, the executable Check type, audit helpers.
[[lean_lib]]
name = "Bdd"
globs = ["Bdd.+"]

# Wallet/Vocab.lean       hand-written glossary definitions         (human-asserted)
# Wallet/Statements.lean  GENERATED by slicegen from features/ + glossary.yaml
# Wallet/Checks.lean      GENERATED by slicegen (executable row/grid checks)
# Wallet/Proofs.lean      hand-written proofs; slicegen only appends stubs
[[lean_lib]]
name = "Wallet"
globs = ["Wallet.+"]

# Second example (../ledger): loops over a Vec and a slice.
# Ledger/Vocab.lean   hand-written glossary definitions for the ledger   (human-asserted)
# Ledger/Lemmas/*.lean  hand-written loop invariants and helper lemmas, one module per Rust function (kernel-checked)
# Its statements, checks and per-scenario proofs live in the Wallet library below
# (Wallet/Statements.lean holds the statements of every feature file).
[[lean_lib]]
name = "Ledger"
globs = ["Ledger.+"]

# Run/Search.lean and Run/Audit.lean are GENERATED scripts, not library
# modules: ../run.sh runs each once with `lake env lean`.
