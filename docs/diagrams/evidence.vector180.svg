  <text id="evidence.strength.left" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="380 612 500 28" data-vector180-line-step="28" x="380" y="632" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">cheap and fast; finds counterexamples</text>
  <text id="evidence.strength.right" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="926 612 640 28" data-vector180-line-step="28" x="1566" y="632" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="end">costly; the only evidence without a sample or a bound</text>
  <rect id="evidence.feedback.box" data-vector180-role="shape" data-vector180-export="native" x="40" y="670" width="1520" height="80" fill="#ffffff" stroke="#9aa6a1" stroke-width="2"/>
  <text id="evidence.feedback.l1" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="60 682 1480 30" data-vector180-line-step="30" x="60" y="703" fill="#17211e" stroke="none" font-family="ABeeZee" font-size="20" font-weight="400" font-style="normal" text-anchor="start">A failing input from any tier is replayed on the Lean model and reported as a counterexample.</text>
  <text id="evidence.feedback.l2" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="60 712 1480 30" data-vector180-line-step="30" x="60" y="733" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="20" font-weight="400" font-style="normal" text-anchor="start">If model and Rust disagree, that is reported as a translation finding. A rule is called proved only with a kernel-checked proof.</text>
</svg>
