  <line id="vocabulary.compiled.from.modifiers" data-vector180-role="connector" data-vector180-export="native" data-vector180-from="vocabulary.lib.modifiers.box" data-vector180-to="vocabulary.compiled.box" x1="800" y1="600" x2="800" y2="652" stroke="#6a4aa3" stroke-width="3"/>
  <ellipse id="vocabulary.compiled.from.modifiers.head" data-vector180-role="shape" data-vector180-export="native" cx="800" cy="652" rx="8" ry="8" fill="#6a4aa3" stroke="none"/>
  <line id="vocabulary.compiled.from.domain" data-vector180-role="connector" data-vector180-export="native" data-vector180-from="vocabulary.lib.domain.box" data-vector180-to="vocabulary.compiled.box" x1="280" y1="600" x2="280" y2="652" stroke="#2b5c9e" stroke-width="3"/>
  <ellipse id="vocabulary.compiled.from.domain.head" data-vector180-role="shape" data-vector180-export="native" cx="280" cy="652" rx="8" ry="8" fill="#2b5c9e" stroke="none"/>
