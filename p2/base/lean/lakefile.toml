name = "slice"
defaultTargets = ["Generated", "Bdd", "Vocab", "Lemmas", "Spec"]

# The Aeneas Lean support library, exactly as shipped inside the release
# tarball that also contains the `aeneas`/`charon` binaries we run
# (nightly-2026.11.09-5a392f4). Fetched by ../translate.sh --setup.
[[require]]
name = "aeneas"
path = "../.tools/aeneas-nightly-2026.11.09-5a392f4/backends/lean"

# Machine-generated by Aeneas from the crates listed in ../crates.txt. Never edit by hand.   (tool-trusted)
[[lean_lib]]
name = "Generated"
globs = ["Generated.+"]

# Fixed support: bridge lemmas, the executable Check type, audit helpers.
[[lean_lib]]
name = "Bdd"
globs = ["Bdd.+"]

# Vocab/<Crate>.lean   hand-written glossary definitions, one file per crate   (human-asserted)
[[lean_lib]]
name = "Vocab"
globs = ["Vocab.+"]

# Lemmas/*.lean   hand-written helper lemmas and loop invariants, written by whoever writes the proofs
#                 (kernel-checked; they appear in no statement). Empty until someone writes one.
[[lean_lib]]
name = "Lemmas"
globs = ["Lemmas.+"]

# Spec/Statements.lean   GENERATED by slicegen from ../features/ + ../glossary.yaml
# Spec/Checks.lean       GENERATED by slicegen (executable row/grid checks)
# Spec/Proofs/<feature>/<scenario>.lean   hand-written proofs, one module per scenario; slicegen only creates `sorry` stubs
[[lean_lib]]
name = "Spec"
globs = ["Spec.+"]

# Run/Search.lean, Run/Audit.lean, Run/Adequacy.lean, Run/AdequacyAudit.lean are GENERATED scripts,
# not library modules: ../run.sh runs each once with `lake env lean`.
