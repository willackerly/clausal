  <text id="pipeline.subtitle" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="40 80 1500 33" data-vector180-line-step="33" x="40" y="103" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="22" font-weight="400" font-style="normal" text-anchor="start">The compiler that turns sentences into Lean is not trusted: Lean type-checks its output and an audit checks every verdict.</text>
  <text id="pipeline.col1.head" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="40 136 420 33" data-vector180-line-step="33" x="40" y="159" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="22" font-weight="400" font-style="normal" text-anchor="start">Written by people or agents</text>
  <text id="pipeline.col2.head" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="590 136 420 33" data-vector180-line-step="33" x="590" y="159" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="22" font-weight="400" font-style="normal" text-anchor="start">Generated and checked</text>
