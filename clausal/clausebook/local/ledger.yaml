# CLAUSEBOOK, LOCAL BOOK OF THE LEDGER FIXTURE. HUMAN-ASSERTED, piece by piece.
#
# The ledger crate's own words: its five operations, the words read off their inputs and answers, its policy
# (`l.valid`) and limits, the relations between two calls and the reference functions of single operations.
# Lean side: lean/Ledger/Pieces.lean (namespace L), shared with the ledger pack (clausebook/ledger.yaml).
# Why each entry is local and not in the pack: clausebook/ASSIGNMENT.md.
# The operation entries are described at the head of clausebook/local/wallet.yaml.
version: 1
book: ledger-local
needs: [core, ledger]
lean_imports: [Ledger.Pieces]
lean_files:
  L: lean/Ledger/Pieces.lean
uses_types: [ledger, index, transfer, batch]
# Literal syntax is glossary.yaml's `param_types`, except for the Lean constructor a literal is written with:
literal_lean:
  batch: 'L.mkBatch [{items}]'
type_echo:
  batch: "a list of transfers, in order"
introduced_by_kind: [batch]

operations:
  - id: l.apply_batch
    domain: ledger
    lean: L.applyBatch
    model: ledger.Ledger.apply_batch
    shape: mut
    state: [[ledger, ledger]]
    input: [[batch, batch]]
    accepted: L.counted
    answer: Usize
    when: ["the batch {batch} is applied to {ledger}"]
    nouns: [batch]
    echo: "applying the batch {batch} to {ledger}, transfer by transfer"
    accepted_echo: "every answer is an acceptance: applying a batch transfer by transfer reports a count and never rejects, so a clause about rejected calls covers no call"
    narrowing:
      rejected: { no_call: true }
  - id: l.apply_all
    domain: ledger
    lean: L.applyAll
    model: ledger.Ledger.apply_all
    shape: mut
    state: [[ledger, ledger]]
    input: [[batch, batch]]
    accepted: L.said
    answer: Bool
    when: ["the batch {batch} is applied to {ledger} as a whole"]
    nouns: ["batch applied as a whole"]
    echo: "applying the batch {batch} to {ledger} as a whole"
    accepted_echo: "an acceptance is the answer yes (true); the answer no is a rejection"
    narrowing:
      accepted: { holds: [l.accepted], one_answer: true }
      rejected: { fails: [l.accepted], one_answer: true }
  - id: l.apply
    domain: ledger
    lean: L.apply
    model: ledger.Ledger.apply
    shape: mut
    state: [[ledger, ledger]]
    input: [[transfer, transfer]]
    accepted: L.said
    answer: Bool
    when: ["the transfer {transfer} is applied to {ledger}"]
    nouns: [transfer, "fund transfer"]
    # "internal": both accounts the transfer names are accounts of the ledger
    internal: { member: "L.isAccount", parties: "L.parties",
                echo: "every account the transfer names is an account of the ledger (internal)" }
    echo: "applying the transfer {transfer} to {ledger}"
    accepted_echo: "an acceptance is the answer yes (true); the answer no is a rejection"
    narrowing:
      accepted: { holds: [l.accepted], one_answer: true }
      rejected: { fails: [l.accepted], one_answer: true }
  - id: l.total
    domain: ledger
    lean: L.total
    model: ledger.Ledger.total
    shape: read0
    state: [[ledger, ledger]]
    input: []
    accepted: L.found
    answer: Option U64
    when: ["the total of {ledger} is computed"]
    nouns: ["computation of the total"]
    echo: "computing the total of {ledger}"
    accepted_echo: "an acceptance is an answer that carries a value; an answer with no value is a rejection"
    narrowing:
      accepted: { holds: [l.found] }
      rejected: { fails: [l.found], one_answer: true }
  - id: l.lookup
    domain: ledger
    lean: L.lookup
    model: ledger.Ledger.balance
    shape: read
    state: [[ledger, ledger]]
    input: [[account, index]]
    accepted: L.found
    answer: Option U64
    when: ["the balance of account {account} of {ledger} is looked up"]
    nouns: [lookup]
    echo: "looking up the balance of account {account} of {ledger}"
    accepted_echo: "an acceptance is an answer that carries a value; an answer with no value is a rejection"
    narrowing:
      accepted: { holds: [l.found] }
      rejected: { fails: [l.found], one_answer: true }

pieces:
  - id: l.valid
    kind: domain
    domain: ledger
    cat: itempred<transfer>
    forms: ["is valid on {l:ledger}"]
    not_forms: ["is not valid on {l:ledger}"]
    lean: "L.valid {l} {item}"
    defs: [L.valid]
    echo: "can be carried out exactly on {l} (both accounts exist and differ, the sender covers the amount, the receiver's balance stays within 2^64 - 1)"
    not_echo: "can NOT be carried out exactly on {l} (an account does not exist, or both are the same, or the sender does not cover the amount, or the receiver's balance would pass 2^64 - 1)"
  - id: l.maximum
    kind: domain
    domain: ledger
    cat: term<num>
    forms: ["the maximum"]
    lean: "L.maximum"
    defs: [L.maximum]
    echo: "the largest total that can be reported (2^64 - 1)"
  - id: l.transfers
    kind: domain
    domain: ledger
    cat: coll<transfer>
    forms: ["transfer of {b:batch}"]
    lean: "L.transfers {b}"
    defs: [L.transfers]
    echo: "transfer of {b}"
  - id: l.length
    kind: domain
    domain: ledger
    cat: term<num>
    forms: ["the length of {b:batch}"]
    lean: "L.length {b}"
    defs: [L.length]
    echo: "the number of transfers in {b}"
  - id: l.applied
    kind: domain
    domain: ledger
    cat: ameasure<num>
    answer: Usize
    forms: ["the number of transfers applied"]
    lean: "L.applied ans"
    defs: [L.applied]
    echo: "the number of transfers the call reports as applied"
  - id: l.stopped_at
    kind: domain
    domain: ledger
    cat: acoll<transfer>
    answer: Usize
    forms: ["transfer at which {b:batch} stopped"]
    lean: "L.stoppedAt {b} ans"
    defs: [L.stoppedAt]
    echo: "transfer of {b} at the position the reported count points to (none if every transfer was applied)"
  - id: l.result
    kind: domain
    domain: ledger
    cat: ameasure<optnum>
    answer: Option U64
    forms: ["the result"]
    lean: "ans"
    echo: "the value the call returns"
  - id: l.accepted
    kind: domain
    domain: ledger
    cat: class
    answer: Bool
    forms: ["it is accepted"]
    not_forms: ["it is rejected"]
    first_call_forms: ["the first call is accepted"]            # said of the first of two compared calls (frame 16)
    first_call_not_forms: ["the first call is rejected"]
    same_as: accepted               # this word IS the operation's own notion of an accepted answer (checked against `narrowing:`)
    lean: "L.said ans"
    defs: [L.said]
    echo: "the answer is yes (accepted)"
    not_echo: "the answer is no (rejected)"
  - id: l.found
    kind: domain
    domain: ledger
    cat: class
    answer: Option U64
    forms: ["there is a result"]
    not_forms: ["there is no result"]
    first_call_forms: ["the first call has a result"]
    first_call_not_forms: ["the first call has no result"]
    lean: "L.found ans"
    defs: [L.found]
    echo: "the call returns a value"
    not_echo: "the call returns no value"
  # relations between two calls (kind "a relation between two inputs"), for the two-run frames
  - id: l.smaller_amount
    kind: domain
    domain: ledger
    cat: variation
    for_op: l.apply
    forms: ["the amount is the same or smaller"]
    retired: [{ in: forms, was: "the amount is smaller", now: "the amount is the same or smaller" }]
    lean: "L.smallerAmount"
    defs: [L.smallerAmount]
    echo: "the second call is on the same ledger, with the same sender and receiver, and its amount is at most the first call's"
  - id: l.larger_amount
    kind: domain
    domain: ledger
    cat: variation
    for_op: l.apply
    forms: ["the amount is the same or larger"]
    retired: [{ in: forms, was: "the amount is larger", now: "the amount is the same or larger" }]
    lean: "L.largerAmount"
    defs: [L.largerAmount]
    echo: "the second call is on the same ledger, with the same sender and receiver, and its amount is at least the first call's"
  - id: l.only_amount_differs
    kind: domain
    domain: ledger
    cat: variation
    for_op: l.apply
    forms: ["only the amount differs"]
    lean: "L.onlyAmountDiffers"
    defs: [L.onlyAmountDiffers]
    echo: "the second call is on the same ledger, with the same sender and receiver (the two amounts may be anything)"
  - id: l.agrees_at_account
    kind: domain
    domain: ledger
    cat: variation
    for_op: l.lookup
    forms: ["the ledger agrees at the account"]
    lean: "L.agreesAtAccount"
    defs: [L.agreesAtAccount]
    echo: "the second call looks up the same account number, on a ledger that holds the same there (the same balance, or no such account in either)"
  - id: l.extended
    kind: domain
    domain: ledger
    cat: variation
    for_op: l.lookup
    forms: ["the ledger is extended"]
    lean: "L.extended"
    defs: [L.extended]
    echo: "the second call looks up the same account number, on the first ledger with accounts added at its end"
  # reference functions (kind "a reference function"), for "agrees with"
  - id: l.ref_lookup
    kind: domain
    domain: ledger
    cat: reference
    for_op: l.lookup
    forms: ["the reference lookup"]
    lean: "L.refLookup"
    defs: [L.refLookup]
    echo: "the reference lookup (the balance at that account number if there is one, otherwise no value; the ledger left as it was)"
  - id: l.ref_lookup_zero
    kind: domain
    domain: ledger
    cat: reference
    for_op: l.lookup
    forms: ["the zero-default lookup"]
    lean: "L.refLookupZero"
    defs: [L.refLookupZero]
    echo: "the zero-default lookup (the balance at that account number, and the value 0 if there is no such account; the ledger left as it was)"
  # reference functions that ARE ANOTHER OPERATION OF THE SAME CODE (added for plan node E1; the two candidate rules of
  # compare/TRADES.md section 5). Unlike the two above they are not written without the code: the rule they make is a
  # relation between two operations of the crate, true or false of the code as a whole.
  - id: l.ref_whole_by_batch
    kind: domain
    domain: ledger
    cat: reference
    for_op: l.apply_all
    forms: ["the same batch applied transfer by transfer and kept only if every transfer is applied"]
    lean: "L.refWholeByBatch"
    defs: [L.refWholeByBatch]
    echo: "the same batch applied transfer by transfer (the operation `apply_batch` of the same code) and kept only if every transfer is applied (accepted, with the ledger that leaves, if it applies every transfer of the batch; otherwise rejected, with the ledger left as it was)"
  - id: l.ref_batch_by_transfers
    kind: domain
    domain: ledger
    cat: reference
    for_op: l.apply_batch
    forms: ["its transfers applied one at a time until one is rejected"]
    lean: "L.refBatchByTransfers"
    defs: [L.refBatchByTransfers, L.foldApply]
    echo: "its transfers applied one at a time, in order, until one is rejected (the operation `apply` of the same code, once per transfer; the answer is how many were accepted before the first rejection, and the ledger is the one those calls leave)"
  - id: index_count
    kind: modifier
    cat: term<num>
    forms: []                       # no surface of its own: "5" would also read as an amount. Used by "exactly <k> ..."
    args: { x: index }
    lean: "{x}.val"
    echo: "{x}"

# ---------------------------------------------------------------------------------------------- idioms
# `i.exactly_applied`: the regular form reads the count as an amount, a different literal type.
idioms:
  - id: i.exactly_applied
    domain: ledger
    cat: claim
    form: "exactly {k:index} transfers are applied"
    means: "result_is(l.applied(), index_count(k))"

# ---------------------------------------------------------------------------------------------- separations
# PROPOSED separating pairs (plan node Q3b). UNSIGNED: each lifts nothing until a person signs it
# (`python3 -m clausal review <id> --reviewer <name>`); the violation of its pair stays in `clausal book check` and names it.
# They stand in this book, not in core, because their sentences are about this project's operations (core may name no
# fixture noun) and a sentence is compiled against the books of one project. Each is two Rule lines written with the
# same words in the shared skeleton; `between` names the two core pieces, `inputs` the line the compiler must read with
# each and not with the other. `witness` is a separating input found by `clausal separate` on the two lines: the state
# and input of one call on which the line for `holds` is true and the other false, of a grid of `grid` inputs, with the
# sha256 of the two Lean terms it was found for. `clausal book check` holds the terms against today's readings;
# `clausal book check --separate` runs `clausal separate` again and compares the input (clausebook/q3b/README.md).
separations:
  - id: sep.more_than.exceeds
    between: [more_than, exceeds]
    inputs:
      more_than: "For a batch for which the length of the batch is more than the total of the ledger's balances, the number of transfers applied is zero"
      exceeds: "For a batch for which the total of the ledger's balances is more than the length of the batch, the number of transfers applied is zero"
    witness:
      holds: more_than
      input: { the_ledger: "[2, 1]", the_batch: "[0->1:1]" }
      grid: 297
      terms:
        more_than: 7931e18f079fda9bd004eddba7314fc2039f3758393a9b93d066c6beeded7983
        exceeds: 2f21a1ca87c1e4214969ca5d6ec2762b4ac870a07c473e3f55c56a85696a90fa
  - id: sep.not_more_than.at_most_value
    between: [not_more_than, at_most_value]
    inputs:
      not_more_than: "For a batch for which the length of the batch is at most the total of the ledger's balances, the number of transfers applied is zero"
      at_most_value: "For a batch for which the total of the ledger's balances is at most the length of the batch, the number of transfers applied is zero"
    witness:
      holds: not_more_than
      input: { the_ledger: "[1, 0]", the_batch: "[0->1:1, 0->1:1]" }
      grid: 297
      terms:
        not_more_than: fb287761250c9b69a15339029e32b3cbd3ddf70fdc8d2dd59f418f69e836a4f5
        at_most_value: 380eb24c462847ed1acfe77a1327f53b9ebb71c6c9bcd9b1bc998593d9130d18
  - id: sep.not_more_than.result_at_most
    between: [not_more_than, result_at_most]
    inputs:
      not_more_than: "For a batch for which the length of the batch is at most the total of the ledger's balances, the number of transfers applied is zero"
      result_at_most: "For a batch, the number of transfers applied is at most the length of the batch"
    witness:
      holds: result_at_most
      input: { the_ledger: "[1, 0]", the_batch: "[0->1:1]" }
      grid: 297
      terms:
        not_more_than: fb287761250c9b69a15339029e32b3cbd3ddf70fdc8d2dd59f418f69e836a4f5
        result_at_most: 2700ce230ffd2f9c64bd3f2f6e09bd6f2e2ebe6f2729d181489e01deaec45e6f
  - id: sep.at_most_value.result_at_most
    between: [at_most_value, result_at_most]
    inputs:
      at_most_value: "For a batch for which the total of the ledger's balances is at most the length of the batch, the number of transfers applied is zero"
      result_at_most: "For a batch, the number of transfers applied is at most the length of the batch"
    witness:
      holds: result_at_most
      input: { the_ledger: "[1, 0]", the_batch: "[0->1:1]" }
      grid: 297
      terms:
        at_most_value: 380eb24c462847ed1acfe77a1327f53b9ebb71c6c9bcd9b1bc998593d9130d18
        result_at_most: 2700ce230ffd2f9c64bd3f2f6e09bd6f2e2ebe6f2729d181489e01deaec45e6f
  - id: sep.is.result_is
    between: [is, result_is]
    inputs:
      is: "A batch for which the total of the ledger's balances is the length of the batch never changes the ledger"
      result_is: "For a batch, the number of transfers applied is the length of the batch"
    witness:
      holds: is
      input: { the_ledger: "[]", the_batch: "[0->1:1]" }
      grid: 297
      terms:
        is: 2d46418bd3b31e3346d5f589713d1561bfb7bd25572f8c67886bab6357feb2a1
        result_is: 72dcb05841998ba35bfb1d86091fa690f54b651f5b343ded181196f4d8e1b27b
  - id: sep.within.covers
    between: [within, covers]
    inputs:
      within: "For a batch, every transfer at which the batch stopped is a transfer of the batch"
      covers: "For a batch, every transfer of the batch is a transfer at which the batch stopped"
    witness:
      holds: within
      input: { the_ledger: "[]", the_batch: "[0->1:1, 1->0:1]" }
      grid: 297
      terms:
        within: 331c40bd569960cef3297358a0ea5040f58ebd116b9ef36203c99b471c1b6ff7
        covers: 73021e20dc69a25de58fa2159b3d21d03e0c8f9e824671c79120c426beb310f5
  - id: sep.same_answer.same_answer_if
    between: [same_answer, same_answer_if]
    inputs:
      same_answer: "A transfer gives the same answer when the amount is the same or larger"
      same_answer_if: "A transfer gives the same answer when the amount is the same or larger, if the first call is rejected"
    witness:
      holds: same_answer_if
      input: { the_ledger: "[1, 0]", the_transfer: "0->1:1", the_ledger_2: "[1, 0]", the_transfer_2: "0->1:2" }
      grid: 4356
      terms:
        same_answer: 1eff9821fdf19d52ea0f5d54f2dfbf7e710fb11432b3842747934a36360e6042
        same_answer_if: 1a2d57a4c360221b674de1890f7b4dbbbe12ff3f3056816c3252901c5a5ea345
