# ACTOR AND LITERAL TYPES of the overlay project `tdf` (plan node T9.7a). The shared glossary.yaml is not edited: an
# overlay project brings its types in a file of its own, in the same format (`param_types`, `actors`; `steps` is the
# old whole-phrase glossary, which an overlay project does not have).
#
# A policy and a request are written in a scenario BY NAME (an `enum` type): the values are the fixtures of
# tdf/lean/Tdf/Pieces.lean. There is no literal syntax for a policy or a request.
param_types:
  request:
    lean: tdf_core.request.Request
    enum:
      'the cleared request declaring obligation 7': Tdf.clearedDeclaring
      'the cleared request declaring nothing': Tdf.clearedSilent
      'the request without a level': Tdf.noLevel
  snapshot:
    lean: tdf_core.snapshot.Snapshot
    enum:
      'the two-level policy': Tdf.twoLevelPolicy

actors:
  policy:
    lean: tdf_core.snapshot.Snapshot
    name_regex: '[A-Z][a-z]+'
    mention: 'policy [A-Z][a-z]+'      # "policy Demo"

steps: []
