<svg xmlns="http://www.w3.org/2000/svg" data-vector180-version="0.1"
  id="vocabulary" viewBox="0 0 1600 870">
  <metadata data-vector180-metadata="vector180-atom-metadata/0.1">{"styleFamily":{"id":"office180.vector180.default","version":"1.0"}}</metadata>
  <rect id="vocabulary.background" data-vector180-role="shape" data-vector180-export="native" x="0" y="0" width="1600" height="870" fill="#ffffff" stroke="none"/>
  <text id="vocabulary.title" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="40 28 1500 51" data-vector180-line-step="51" x="40" y="64" fill="#17211e" stroke="none" font-family="ABeeZee" font-size="34" font-weight="400" font-style="normal" text-anchor="start">A sentence is compiled from reusable, typed pieces</text>
  <text id="vocabulary.subtitle" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="40 80 1500 33" data-vector180-line-step="33" x="40" y="103" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="22" font-weight="400" font-style="normal" text-anchor="start">Each piece is defined in Lean and signed off once. A new sentence built from known pieces needs no new judgement.</text>
  <rect id="vocabulary.seg.internal.box" data-vector180-role="shape" data-vector180-export="native" x="260" y="150" width="150" height="70" fill="#efe9f8" stroke="#6a4aa3" stroke-width="3"/>
  <text id="vocabulary.seg.internal.text" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="260 168 150 39" data-vector180-line-step="39" x="335" y="196" fill="#17211e" stroke="none" font-family="ABeeZee" font-size="26" font-weight="400" font-style="normal" text-anchor="middle">Internal</text>
  <rect id="vocabulary.seg.transfers.box" data-vector180-role="shape" data-vector180-export="native" x="410" y="150" width="250" height="70" fill="#e3edf9" stroke="#2b5c9e" stroke-width="3"/>
  <text id="vocabulary.seg.transfers.text" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="410 168 250 39" data-vector180-line-step="39" x="535" y="196" fill="#17211e" stroke="none" font-family="ABeeZee" font-size="26" font-weight="400" font-style="normal" text-anchor="middle">fund transfers</text>
  <rect id="vocabulary.seg.never.box" data-vector180-role="shape" data-vector180-export="native" x="660" y="150" width="240" height="70" fill="#e4f2ec" stroke="#24735d" stroke-width="3"/>
  <text id="vocabulary.seg.never.text" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="660 168 240 39" data-vector180-line-step="39" x="780" y="196" fill="#17211e" stroke="none" font-family="ABeeZee" font-size="26" font-weight="400" font-style="normal" text-anchor="middle">never change</text>
  <rect id="vocabulary.seg.aggregate.box" data-vector180-role="shape" data-vector180-export="native" x="900" y="150" width="190" height="70" fill="#efe9f8" stroke="#6a4aa3" stroke-width="3"/>
  <text id="vocabulary.seg.aggregate.text" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="900 168 190 39" data-vector180-line-step="39" x="995" y="196" fill="#17211e" stroke="none" font-family="ABeeZee" font-size="26" font-weight="400" font-style="normal" text-anchor="middle">aggregate</text>
  <rect id="vocabulary.seg.value.box" data-vector180-role="shape" data-vector180-export="native" x="1090" y="150" width="250" height="70" fill="#e3edf9" stroke="#2b5c9e" stroke-width="3"/>
  <text id="vocabulary.seg.value.text" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="1090 168 250 39" data-vector180-line-step="39" x="1215" y="196" fill="#17211e" stroke="none" font-family="ABeeZee" font-size="26" font-weight="400" font-style="normal" text-anchor="middle">account value</text>
  <text id="vocabulary.seg.rule" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="40 168 210 39" data-vector180-line-step="39" x="250" y="196" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="26" font-weight="400" font-style="normal" text-anchor="end">Rule:</text>
  <text id="vocabulary.seg.legend" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="260 234 1080 28" data-vector180-line-step="28" x="260" y="254" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">Colour shows the kind of piece each phrase is, and which library below it comes from.</text>
  <rect id="vocabulary.lib.domain.box" data-vector180-role="shape" data-vector180-export="native" x="60" y="300" width="440" height="300" fill="#e3edf9" stroke="#2b5c9e" stroke-width="3"/>
  <text id="vocabulary.lib.domain.title" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="80 316 400 42" data-vector180-line-step="42" x="80" y="346" fill="#17211e" stroke="none" font-family="ABeeZee" font-size="28" font-weight="400" font-style="normal" text-anchor="start">Domain words</text>
  <text id="vocabulary.lib.domain.sub" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="80 358 400 28" data-vector180-line-step="28" x="80" y="378" fill="#2b5c9e" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">per project, bound to the code</text>
  <text id="vocabulary.lib.domain.body.l1" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="80 404 400 28" data-vector180-line-step="28" x="80" y="424" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">account, account value, ledger</text>
  <text id="vocabulary.lib.domain.body.l2" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="80 434 400 28" data-vector180-line-step="28" x="80" y="454" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">transfer, deposit, withdraw, batch</text>
  <text id="vocabulary.lib.domain.body.l3" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="80 464 400 28" data-vector180-line-step="28" x="80" y="484" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start"></text>
  <text id="vocabulary.lib.domain.body.l4" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="80 494 400 28" data-vector180-line-step="28" x="80" y="514" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">Types, measures and operations.</text>
  <text id="vocabulary.lib.domain.body.l5" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="80 524 400 28" data-vector180-line-step="28" x="80" y="544" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">Each operation is tied to the</text>
  <text id="vocabulary.lib.domain.body.l6" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="80 554 400 28" data-vector180-line-step="28" x="80" y="574" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">function in the Rust source.</text>
  <rect id="vocabulary.lib.modifiers.box" data-vector180-role="shape" data-vector180-export="native" x="580" y="300" width="440" height="300" fill="#efe9f8" stroke="#6a4aa3" stroke-width="3"/>
  <text id="vocabulary.lib.modifiers.title" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="600 316 400 42" data-vector180-line-step="42" x="600" y="346" fill="#17211e" stroke="none" font-family="ABeeZee" font-size="28" font-weight="400" font-style="normal" text-anchor="start">Modifiers</text>
  <text id="vocabulary.lib.modifiers.sub" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="600 358 400 28" data-vector180-line-step="28" x="600" y="378" fill="#6a4aa3" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">shared across projects</text>
  <text id="vocabulary.lib.modifiers.body.l1" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="600 404 400 28" data-vector180-line-step="28" x="600" y="424" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">internal, aggregate, successful,</text>
  <text id="vocabulary.lib.modifiers.body.l2" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="600 434 400 28" data-vector180-line-step="28" x="600" y="454" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">rejected, given, then, bystander</text>
  <text id="vocabulary.lib.modifiers.body.l3" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="600 464 400 28" data-vector180-line-step="28" x="600" y="484" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start"></text>
  <text id="vocabulary.lib.modifiers.body.l4" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="600 494 400 28" data-vector180-line-step="28" x="600" y="514" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">Functions from a piece to a</text>
  <text id="vocabulary.lib.modifiers.body.l5" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="600 524 400 28" data-vector180-line-step="28" x="600" y="544" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">piece of the same kind:</text>
  <text id="vocabulary.lib.modifiers.body.l6" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="600 554 400 28" data-vector180-line-step="28" x="600" y="574" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">narrow, combine or sum.</text>
  <rect id="vocabulary.lib.frames.box" data-vector180-role="shape" data-vector180-export="native" x="1100" y="300" width="440" height="300" fill="#e4f2ec" stroke="#24735d" stroke-width="3"/>
  <text id="vocabulary.lib.frames.title" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="1120 316 400 42" data-vector180-line-step="42" x="1120" y="346" fill="#17211e" stroke="none" font-family="ABeeZee" font-size="28" font-weight="400" font-style="normal" text-anchor="start">Frames</text>
  <text id="vocabulary.lib.frames.sub" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="1120 358 400 28" data-vector180-line-step="28" x="1120" y="378" fill="#24735d" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">shared across projects, signed once</text>
  <text id="vocabulary.lib.frames.body.l1" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="1120 404 400 28" data-vector180-line-step="28" x="1120" y="424" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">never changes, always, only if,</text>
  <text id="vocabulary.lib.frames.body.l2" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="1120 434 400 28" data-vector180-line-step="28" x="1120" y="454" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">exactly when, changes only,</text>
  <text id="vocabulary.lib.frames.body.l3" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="1120 464 400 28" data-vector180-line-step="28" x="1120" y="484" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">at most, every, more never loses,</text>
  <text id="vocabulary.lib.frames.body.l4" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="1120 494 400 28" data-vector180-line-step="28" x="1120" y="514" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">agrees with, independent of</text>
  <text id="vocabulary.lib.frames.body.l5" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="1120 524 400 28" data-vector180-line-step="28" x="1120" y="544" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start"></text>
  <text id="vocabulary.lib.frames.body.l6" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="1120 554 400 28" data-vector180-line-step="28" x="1120" y="574" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">The logical shape of a claim.</text>
  <rect id="vocabulary.compiled.box" data-vector180-role="shape" data-vector180-export="native" x="60" y="660" width="1480" height="170" fill="#ffffff" stroke="#9aa6a1" stroke-width="3"/>
  <text id="vocabulary.compiled.label" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="80 674 400 30" data-vector180-line-step="30" x="80" y="695" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="20" font-weight="400" font-style="normal" text-anchor="start">Compiled reading</text>
  <text id="vocabulary.compiled.formula" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="80 708 1440 42" data-vector180-line-step="42" x="80" y="738" fill="#17211e" stroke="none" font-family="ABeeZee" font-size="28" font-weight="400" font-style="normal" text-anchor="start">never-changes ( internal ( transfer ) ,  aggregate ( account value ) )</text>
  <text id="vocabulary.compiled.echo1" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="80 760 1440 30" data-vector180-line-step="30" x="80" y="781" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="20" font-weight="400" font-style="normal" text-anchor="start">Echoed back: for every ledger and every transfer between two of its accounts, accepted or rejected,</text>
  <text id="vocabulary.compiled.echo2" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="80 788 1440 30" data-vector180-line-step="30" x="80" y="809" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="20" font-weight="400" font-style="normal" text-anchor="start">the call returns, and the sum of all balances afterwards equals the sum before.</text>
