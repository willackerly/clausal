  <text id="evidence.property.body.l3" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="700 338 244 28" data-vector180-line-step="28" x="700" y="358" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">edges, shrunk to a</text>
