# FRAMES DEFINED IN LEAN WITH NO SURFACE FORM YET. Each has a definition, an executable second reading and
# a comparison of the two on generated inputs (lean/Run/FrameTests.lean); none is reachable from a sentence,
# because no fixture needs it and the hole types it takes (a relation between two inputs, a reference
# function) have no domain word here yet.
frames_without_surface:
  - { id: count_of, number: 11, lean: Frames.CountOf, check: Frames.Check.countOf,
      echo: "at most / at least / exactly n {c} {p}, judged on the state after the call" }
  - { id: monotone, number: 12, lean: Frames.Monotone, check: Frames.Check.monotone,
      echo: "whenever a second state and input are {more} than the first and, for the first, {c}, then {c} for the second too (both calls must answer)" }
  - { id: agrees_with, number: 13, lean: Frames.AgreesWith, check: Frames.Check.agreesWith,
      echo: "the answer and the state after the call are exactly what {ref} gives" }
  - { id: independent_of, number: 14, lean: Frames.IndependentOf, check: Frames.Check.independentOf,
      echo: "two calls whose states and inputs differ only in {h} show the same {view} (both calls must answer)" }

# ---------------------------------------------------------------------------------------------- idioms
# A surface form that is not the regular form of any one piece, with the composition of pieces it MEANS.
# An idiom adds English, not Lean: its reading is the reading of the composition, and it is signed off as
# "this sentence means that composition". The right-hand side uses piece ids applied to the holes.
idioms:
  - id: i.has_balance
    domain: wallet
    cat: cond
    form: "{w:wallet} has a balance of {t:term<num>}"
    means: "is(w.balance(w), t)"
  - id: i.holds
    domain: ledger
    cat: cond
    form: "{l:ledger} holds the balances {t:term<balances>}"
    means: "is(l.ledger(l), t)"
  - id: i.add_up_to
    domain: shared
    cat: cond
    form: "{ns:nums} add up to {t:term<num>}"
    means: "is(aggregate(ns), t)"
  - id: i.add_up_to_more
    domain: shared
    cat: cond
    form: "{ns:nums} add up to more than {t:term<num>}"
    means: "exceeds(aggregate(ns), t)"
  - id: i.now_holds
    domain: ledger
    cat: claim
    form: "{l:ledger} now holds the balances {t:term<balances>}"
    means: "becomes(l.ledger(l), t)"
  - id: i.none_applied
    domain: ledger
    cat: claim
    form: "no transfer is applied"
    means: "result_is(l.applied(), zero())"
  - id: i.all_applied
    domain: ledger
    cat: claim
    form: "every transfer of {b:batch} is applied"
    means: "result_is(l.applied(), l.length(b))"
  - id: i.exactly_applied
    domain: ledger
    cat: claim
    form: "exactly {k:index} transfers are applied"
    means: "result_is(l.applied(), index_count(k))"
  - id: i.stopped_only_at
    domain: ledger
    cat: claim
    form: "the batch {b:batch} has stopped only at a transfer that {p:itempred<transfer>} as it now stands"
    means: "every_of(l.stopped_at(b), p)"
  - id: i.moved
    domain: ledger
    cat: claim
    form: "the amount of {t:transfer} has moved between its accounts in {l:ledger} and no other balance changed"
    means: "decreases_by(l.bal_of(l.sender(t), l), l.amount_of(t)); increases_by(l.bal_of(l.receiver(t), l), l.amount_of(t)); changes_only(l.accounts(l), [l.sender(t), l.receiver(t)])"
