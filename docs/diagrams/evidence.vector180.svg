  <text id="evidence.proof.title" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="1304 178 244 40" data-vector180-line-step="40" x="1304" y="207" fill="#17211e" stroke="none" font-family="ABeeZee" font-size="27" font-weight="400" font-style="normal" text-anchor="start">Proof</text>
  <text id="evidence.proof.cover" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="1304 222 244 27" data-vector180-line-step="27" x="1304" y="241" fill="#24735d" stroke="none" font-family="ABeeZee" font-size="18" font-weight="400" font-style="normal" text-anchor="start">every input, every size</text>
  <text id="evidence.proof.body.l1" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="1304 278 244 28" data-vector180-line-step="28" x="1304" y="298" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">Checked by the Lean</text>
  <text id="evidence.proof.body.l2" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="1304 308 244 28" data-vector180-line-step="28" x="1304" y="328" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">kernel against the</text>
  <text id="evidence.proof.body.l3" data-vector180-role="text" data-vector180-export="native" data-vector180-frame="1304 338 244 28" data-vector180-line-step="28" x="1304" y="358" fill="#4b5a55" stroke="none" font-family="ABeeZee" font-size="19" font-weight="400" font-style="normal" text-anchor="start">model generated from</text>
