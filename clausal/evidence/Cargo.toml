# Plan node E1: property tests GENERATED from the composition trees of the compiled sentences (../build/trees.json),
# run against the COMPILED Rust crates. src/checks.rs and src/table.rs are generated by `python3 -m clausal gen`;
# src/typed.rs (one typed reading per vocabulary piece) and src/main.rs (the generic runner) are written once.
# The Kani harnesses generated from the same trees are in kani/ (a crate of its own: Kani must not compile proptest).
[package]
name = "rule-evidence"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
wallet = { path = "../wallet" }
ledger = { path = "../ledger" }
counter = { path = "../counter" }
kvparse = { path = "../kvparse" }
wallet-bdd = { path = "../wallet-bdd" }
serde_json = "1"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

# Debug semantics on purpose: integer overflow and out-of-range indexing panic, which is also what the Lean model
# of the same code says (a panic is `fail`). opt-level 1 only for speed.
[profile.dev]
opt-level = 1
overflow-checks = true
debug-assertions = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace]
