# CLAUSEBOOK, CORE. HUMAN-ASSERTED, piece by piece.
#
# The part of the Clausebook that is the same for every project: the FRAMES (statement shapes about one operation, with
# typed holes) and the MODIFIERS (functions from pieces to a piece), with the reading rules printed beside every
# reading (`defaults:`) and the lines printed about which calls a claim covers (`coverage:`).
#   Lean side: lean/Frames/Core.lean (modifiers), lean/Frames/Frames.lean (frames), or plain Lean notation
#   (=, ≤, <, +, ¬) written out below; second, executable reading of each frame: lean/Frames/Check.lean.
#
# THIS BOOK NAMES NO WORD OF ANY ONE PROJECT. It has no operation, no domain word, no literal type and no actor type;
# it loads alone (`python3 -m clausal book check` does so on every run) and lean/Frames builds alone. A project adds
# its own books after it (clausebook/project.yaml): word packs and local books, which supply the DOMAIN WORDS
# (operations, measures, conditions, collections, answer words), the literal types and the further sorts.
#
# A sentence (a Gherkin step, or a `Rule:` line) is not bound as a whole. It is ASSEMBLED from pieces, each with a type.
# The compiler (clausal/vocab.py) is untrusted and dumb: it finds the ONE way a sentence is built from the forms of
# the loaded books (none: UNBOUND; a way exists only if types are ignored: ILL-TYPED; several: AMBIGUOUS; each with
# file:line) and writes the Lean term the pieces spell out. Lean type-checks the result.
#
# TEMPLATES. `lean` is the Lean text of the piece with its holes filled in; inside it `st` is the state the
# piece is read on, `inp` the input of the call, `ans` the answer, `{item}` the item an item condition is
# about, `{op}` the operation (with every scoping modifier applied). `echo` is the fixed English the
# piece contributes to the reading that is printed back.
# `flat` (frames only) is the frame's content at ONE call written out without the frame library, for the flat proof
# obligation: `{m}` is a hole read on the state before the call (`st`), `{m'}` the same hole read on the state after
# it (`st'`); `ans` is the answer; in a two-run frame `{c2}` is the hole read on the second call's answer (`ans2`).
# The obligation is UNTRUSTED text: a generated, kernel-checked equivalence ties it to the reading
# (`<id>.reading_iff_obligation`).
#
# ONE LIVE FORM PER PIECE PER POSITION (plan node Q4). Wording changes by REPLACEMENT: the new form takes the place of
# the old one in the entry, and the old one is recorded under `retired:` of the same entry (so it is under the entry's
# digest):   retired: [{ in: <the field it was a form of>, was: "<old form>", now: "<the form that replaced it>" }]
# A retired form is NOT accepted. A sentence written with it is refused (UNBOUND, code RETIRED-FORM) and the refusal
# names the form to write, and the whole sentence rewritten where the compiler can check that the rewriting compiles.
# Positions a piece may have a form in: `forms` (any step), `not_forms` (negated), `then_forms` (a Then; in a Rule line
# through "for <subject>, <claim>" only for a frame that has no verb phrase with the same holes), `vp_forms` (Rule verb
# phrase), `subject_forms` (Rule subject), `claim_forms` (before the claim of a Then step), and for a class
# `first_call_forms` / `first_call_not_forms` (said of the first of two compared calls: a hole written `{c:class@first}`).
version: 1
book: core
lean_imports: [Frames.Lemmas]
# where the Lean definitions named under `defs:` live (for display, digests and sign-off)
lean_files:
  Frames: [lean/Frames/Core.lean, lean/Frames/Frames.lean]
# Literal and actor types this book's holes name. None: a book that named one could not load without the project
# that defines it.
uses_types: []

# CATEGORIES: the type of a piece, and of each hole `{name:category}` in a form. `<T>` stands for any one SORT, the
# same throughout a form. Core has one sort, `num` (a natural number); a pack or a local book adds its own (`sorts:`).
# Beside these, a hole may be typed by a literal type or an actor type of the project (none in this book).
sorts: [num]
categories:
  measure: "measure<T>: a quantity of the state, read before and after the call"
  nums: "a collection of numbers of the state (to be totalled)"
  per_actor: "one number per actor of a type the project names (the plural of a per-actor measure)"
  term: "term<T>: a value known before the call"
  cond: "a condition on the state before the call and the input"
  item: "item<T>: one item"
  coll: "coll<T>: a collection of items, read before the call"
  itempred: "itempred<T>: a condition on an item"
  parts: "parts<T>: the parts of the state a 'changes only' claim ranges over"
  ameasure: "ameasure<T>: a quantity of the answer"
  class: "a class of answers"
  acoll: "acoll<T>: a collection read off the answer"
  variation: "a relation between TWO calls of one operation: a domain word, tied to the operation whose state and input it compares (`for_op`)"
  reference: "a reference function: what a call of one operation should answer and leave (`for_op`)"
  claim: "what a Then says, or what a Rule says of its subject: one or more frames applied to the operation"
  opmod: "a modifier on the operation: scope, narrowing, sequence"

# THE DEFAULTS. Fail-closed, and printed with every reading they were applied to.
defaults:
  D1: "always answers: the call must return an answer for every input the reading applies to (no panic, no abort, no endless loop)"
  D2: "rejected calls are covered: the reading applies to every call, whether the operation accepts or rejects it"
  D3: "before / after one call: 'unchanged', 'increased by' and the like compare the state before one call with the state after it, not states in between"
  D4: "for all values: every outline <parameter>, every state and every input is universally quantified at the front; the Examples rows are instances"
  D5: "collection words bind inside their own clause: 'every', 'the first', 'no' range over the named collection within the one Given, Then or Rule clause they occur in"
  D6: "'the first X of XS is P' requires that there is a first X"
  D7: "items are judged afterwards: in a Then about a collection read off the answer, each item is judged on the state after the call"
  D8: "conditions are read before the call: what 'assuming', 'for which', 'whenever', 'only if' and 'exactly when' say about the state is judged on the state before the call (of a sequence: before its first call), not on any state the call passes through or leaves"
  D9: "negation binds to the one condition it is written on: 'every X is not P' means that no X is P, never 'not every X is P'"
  D10: "two calls are compared: the claim is about every pair of calls of the operation related as stated; both calls are in scope, the first is the one the words 'for the first call' speak of, and both must give an answer"

# ---------------------------------------------------------------------------------------------- coverage
# WHICH CALLS A CLAIM IS ABOUT, as it is printed (plan node Q2). One entry per constructor of `Frames.Calls`
# (lean/Frames/Core.lean): the default `every`, and the two narrowings a modifier has to ask for. The printed lines are
# chosen by the Calls value of each claim's emitted operation, never by the words of the sentence, and on every run
# Lean is asked for that value and the printed line is compared with it (lean/Run/Narrowing.lean, `clausal narrowing`).
# These entries are entries of the book like any other: signed off by id, under the digest (with the text of every
# default they name), and listed among the pieces of every reading that prints them.
#   covers        the line of the `covers` slot
#   answer        (every) the line that says the call must give an answer; `answer_asked` when the sentence asks for it too
#   prefix        put before a claim's own line when the claims of one clause do not all cover the same calls
#   two_calls     the note under a claim that compares two calls
#   sequence      the note under a Rule clause about a sequence ("<operation> followed by <operation>"): what a sequence
#                 must do to be covered. Under `every` each call must answer; under a narrowing no call has to, and a
#                 sequence in which a call gives no answer is outside the clause. `sequence_scenario` (every): the note
#                 of a scenario with several Whens (a scenario always has a claim about every call, D1)
#   removes       the defaults that do NOT apply to a claim narrowed this way, whatever its frame names
#   weakening     stated when the narrowing REMOVES a default (the `not default` slot)
coverage:
  - id: calls.every
    calls: every
    lean: "Frames.Calls.every"
    defs: [Frames.Calls, Frames.Op.HoldsAt, Frames.Op.HoldsAt2]
    defaults: [D1, D2, D10]
    covers: "every such call, accepted or rejected [default D2]"
    answer: "the call gives an answer [default D1]"
    answer_asked: "the call gives an answer [default D1; also asked for by '{words}']"
    prefix: ""
    two_calls: "(TWO calls are compared: every pair of calls of the operation related as stated; both must be in scope and both must give an answer [default D10])"
    sequence: "(of a sequence: every call in it must answer; the answer spoken of is the LAST call's)"
    sequence_scenario: "(of a sequence: every call in it must answer; the answer spoken of is the LAST call's; earlier answers are otherwise unconstrained)"
    echo: "every call in scope, accepted or rejected, and each must give an answer"
  - id: calls.accepted
    calls: accepted
    lean: "Frames.Calls.accepted"
    defs: [Frames.Calls, Frames.Op.HoldsAt, Frames.Op.HoldsAt2]
    removes: [D1, D2, D10]
    covers: "ONLY accepted calls [asked for]"
    prefix: "if the call is accepted: "
    two_calls: "(TWO calls are compared: every pair of calls of the operation related as stated, both in scope, in which BOTH calls give an answer and BOTH are accepted; a pair in which either call gives no answer, or is rejected, is outside this clause)"
    sequence: "(of a sequence: ONLY sequences in which every call gives an answer and the LAST call is accepted are covered; a sequence in which any call gives no answer, or whose last call is rejected, is outside this clause; the answer spoken of is the LAST call's, and whether an earlier call was accepted or rejected is not looked at)"
    weakening: "ONLY accepted calls are covered (asked for by 'accepted' on the subject of a Rule line, or by 'if it is accepted,' before a Then); calls that are rejected, or that give no answer, are outside this clause"
    echo: "accepted calls only; a call that is rejected or gives no answer is not covered"
  - id: calls.rejected
    calls: rejected
    lean: "Frames.Calls.rejected"
    defs: [Frames.Calls, Frames.Op.HoldsAt, Frames.Op.HoldsAt2]
    removes: [D1, D2, D10]
    covers: "ONLY rejected calls [asked for]"
    prefix: "if the call is rejected: "
    two_calls: "(TWO calls are compared: every pair of calls of the operation related as stated, both in scope, in which BOTH calls give an answer and BOTH are rejected; a pair in which either call gives no answer, or is accepted, is outside this clause)"
    sequence: "(of a sequence: ONLY sequences in which every call gives an answer and the LAST call is rejected are covered; a sequence in which any call gives no answer, or whose last call is accepted, is outside this clause; the answer spoken of is the LAST call's, and whether an earlier call was accepted or rejected is not looked at)"
    weakening: "ONLY rejected calls are covered (asked for by 'rejected' on the subject of a Rule line, or by 'if it is rejected,' before a Then); calls that are accepted, or that give no answer, are outside this clause"
    echo: "rejected calls only; a call that is accepted or gives no answer is not covered"

# ---------------------------------------------------------------------------------------------- pieces
pieces:
  # =================================================================== MODIFIERS
  - id: zero
    kind: modifier
    cat: term<num>
    forms: ["zero"]
    lean: "0"
    echo: "0"
  # comparisons: a condition from a measure and a value
  - id: is
    kind: modifier
    cat: cond
    forms: ["{m:measure<T>} is {t:term<T>}"]
    lean: "{m} = {t}"
    echo: "{m} is {t}"
  - id: not_more_than
    kind: modifier
    cat: cond
    forms: ["{t:term<num>} is at most {m:measure<num>}"]
    retired: [{ in: forms, was: "{t:term<num>} is not more than {m:measure<num>}", now: "{t:term<num>} is at most {m:measure<num>}" }]
    lean: "{t} ≤ {m}"
    echo: "{t} is at most {m}"
  - id: more_than
    kind: modifier
    cat: cond
    forms: ["{t:term<num>} is more than {m:measure<num>}"]
    lean: "{m} < {t}"
    echo: "{t} is strictly more than {m}"
  - id: exceeds
    kind: modifier
    cat: cond
    forms: ["{m:measure<num>} is more than {t:term<num>}"]
    lean: "{t} < {m}"
    echo: "{m} is strictly more than {t}"
  - id: at_most_value
    kind: modifier
    cat: cond
    forms: ["{m:measure<num>} is at most {t:term<num>}"]
    lean: "{m} ≤ {t}"
    echo: "{m} is at most {t}"
  - id: sum_within
    kind: modifier
    cat: cond
    forms: ["{m:measure<num>} plus {t:term<num>} is at most {z:term<num>}"]
    retired: [{ in: forms, was: "{m:measure<num>} plus {t:term<num>} does not exceed {z:term<num>}", now: "{m:measure<num>} plus {t:term<num>} is at most {z:term<num>}" }]
    lean: "{m} + {t} ≤ {z}"
    echo: "{m} plus {t} is at most {z}"
  - id: sum_exceeds
    kind: modifier
    cat: cond
    forms: ["{m:measure<num>} plus {t:term<num>} exceeds {z:term<num>}"]
    lean: "{z} < {m} + {t}"
    echo: "{m} plus {t} is strictly more than {z}"
  # negation of the one atomic condition / class / item condition it is attached to (the `not_forms` above)
  - id: not
    kind: modifier
    cat: "*"
    forms: []
    lean: "¬ ({p})"
    echo: "it is NOT the case that {p}"
  # measures from measures
  - id: aggregate
    kind: modifier
    cat: measure<num>
    forms: ["the total of {ns:nums}"]
    retired: [{ in: forms, was: "the aggregate {ns:nums}", now: "the total of {ns:nums}" }]
    lean: "Frames.aggregate ({ns})"
    defs: [Frames.aggregate]
    echo: "the sum of {ns}"
  - id: all_of
    kind: modifier
    cat: nums
    forms: ["all {pm:per_actor}"]
    lean: "[{pm}]"
    echo: "{pm}"
  # quantifiers over a named collection (in a condition)
  - id: holds_of
    kind: modifier
    cat: cond
    forms: ["{i:item<T>} {p:itempred<T>}"]
    lean: "{p}"
    item: "{i}"
    echo: "{i} {p}"
  - id: every
    kind: modifier
    cat: cond
    forms: ["every {c:coll<T>} {p:itempred<T>}"]
    lean: "Frames.every ({c}) (fun x => {p})"
    item: "x"
    defs: [Frames.every]
    echo: "every {c} {p}"
  - id: the_first
    kind: modifier
    cat: cond
    forms: ["the first {c:coll<T>} {p:itempred<T>}"]
    lean: "Frames.theFirst ({c}) (fun x => {p})"
    item: "x"
    defs: [Frames.theFirst]
    echo: "there is a first {c}, and it {p}"
    defaults: [D6]
  - id: no_such
    kind: modifier
    cat: cond
    forms: ["no {c:coll<T>} {p:itempred<T>}"]
    lean: "Frames.noneOf ({c}) (fun x => {p})"
    item: "x"
    defs: [Frames.noneOf]
    echo: "no {c} {p}"
  - id: some_of
    kind: modifier
    cat: cond
    forms: ["some {c:coll<T>} {p:itempred<T>}"]
    lean: "Frames.someOf ({c}) (fun x => {p})"
    item: "x"
    defs: [Frames.someOf]
    echo: "at least one {c} {p}"
  # modifiers on the operation. They have no `lean` of their own here: the compiler applies them to `{op}`.
  # THEIR SURFACE FORMS, by position (plan node Q3: every accepted form is in the book, none in the compiler):
  #   subject_forms   in the subject of a Rule line: an adjective before the operation noun ("rejected {op}"), a
  #                   relative clause after it ("{op} for which {c:cond}"), a sequence ("{op} followed by {op2}")
  #   claim_forms     before the claim of a Then step. In a Rule line a narrowing is written on the subject and nowhere
  #                   else (`g.rule_for`, `narrowing: on_subject`): "for a rejected {op}, {claim}"
  # A subject takes one narrowing adjective, and `internal` after it: "an accepted internal {op}".
  # `{op}`, `{op2}` and `{claim}` stand for the operation and the claim the modifier is applied to; they are places in
  # the sentence, not holes of the piece. In a scenario, `given` is also every Gherkin Given, `and_then` every further
  # When, `beside` every actor the scenario names and the When does not pass to the operation.
  - id: given
    kind: modifier
    cat: opmod
    forms: []                       # a Gherkin `Given`; in a Rule: "<subject> for which <condition>"
    subject_forms: ["{op} for which {c:cond}"]
    lean: "({op}).given (fun st inp => {c})"
    defs: [Frames.Op.given]
    echo: "assuming {c}"
  - id: rejected
    kind: modifier
    cat: opmod
    forms: []                       # Then step: "if it is rejected, <claim>"; Rule: "a rejected <operation>"
    subject_forms: ["rejected {op}"]
    claim_forms: ["if it is rejected, {claim}"]
    lean: "({op}).rejected"
    calls: rejected                 # the Calls value it sets (printed through `coverage:`; checked against Lean on every run)
    defs: [Frames.Op.rejected, Frames.Calls]
    echo: "rejected calls only"
  - id: successful
    kind: modifier
    cat: opmod
    forms: []                       # Then step: "if it is accepted, <claim>"; Rule: "an accepted <operation>"
    subject_forms: ["accepted {op}"]
    retired: [{ in: subject_forms, was: "successful {op}", now: "accepted {op}" }]
    claim_forms: ["if it is accepted, {claim}"]
    lean: "({op}).successful"
    calls: accepted                 # the Calls value it sets (printed through `coverage:`; checked against Lean on every run)
    defs: [Frames.Op.successful, Frames.Calls]
    echo: "accepted calls only"
  # `internal` is bound by the OPERATION it is said of: an operation that can be internal gives, in its own entry
  # (`internal:`), the membership test `member`, the parties its input names `parties`, and the line the echo prints.
  # An operation with no such field cannot be called internal.
  - id: internal
    kind: modifier
    cat: opmod
    forms: []                       # Rule: "an internal <operation>"
    subject_forms: ["internal {op}"]
    from_operation: [member, parties]       # these two holes are filled from the operation's own entry, not from the sentence
    lean: "({op}).internal {member} {parties}"
    defs: [Frames.Op.internal]
    echo: "every party the input names is a member of the state"
  - id: and_then
    kind: modifier
    cat: opmod
    forms: []                       # two or more Whens in one scenario; in a Rule: "<operation> followed by <operation>"
    subject_forms: ["{op} followed by {op2}"]
    lean: "({op}).andThen {op2}"
    defs: [Frames.Op.andThen]
    echo: "then, on the state that leaves,"
  - id: beside
    kind: modifier
    cat: opmod
    forms: []                       # an actor the scenario names and the When does not pass to the operation
    lean: "({op}).beside {type}"
    defs: [Frames.Op.beside]
    echo: "a bystander, not passed to the operation"
  - id: accepted
    kind: modifier
    cat: class
    forms: []                       # the operation's own notion of an accepted answer (Rule: "is always accepted")
    lean: "({opbase}).accepted ans"
    consts: [Frames.Op.accepted]    # the field of the operation it reads (what the audit lets the reading mention)
    echo: "the answer is an acceptance (see `accepted`)"
  # =================================================================== FRAMES
  # `implied: { c: accepted }`: a form of the frame that has no hole `c` says the class with its own words ("is accepted
  # whenever", "never loses acceptance", "is always accepted"): the class is then the operation's own notion of an
  # accepted answer, the modifier `accepted`. A form that leaves a hole unfilled with no `implied` piece is refused.
  - id: always_answers
    kind: frame
    number: 1
    cat: claim
    then_forms: ["it answers"]
    vp_forms: ["always answers"]
    lean: "Frames.AlwaysAnswers {op}"
    at: "Frames.AlwaysAnswers.at {op}"
    check: "Frames.Check.alwaysAnswers {op}"
    defs: [Frames.AlwaysAnswers, Frames.AlwaysAnswers.at, Frames.Op.HoldsAt]
    flat: "True"
    echo: "the call gives an answer"
  - id: never_changes
    kind: frame
    number: 2
    cat: claim
    then_forms: ["{m:measure<T>} is unchanged"]
    vp_forms: ["never changes {m:measure<T>}"]
    lean: "Frames.NeverChanges {op} {m}"
    at: "Frames.NeverChanges.at {op} {m}"
    check: "Frames.Check.neverChanges {op} {m}"
    defs: [Frames.NeverChanges, Frames.NeverChanges.at, Frames.Op.HoldsAt]
    flat: "{m'} = {m}"
    echo: "{m} after the call equals {m} before it"
    defaults: [D3]
  - id: changes_only
    kind: frame
    number: 3
    cat: claim
    then_forms: ["of {c:parts<T>}, only {x:term<T>} and {y:term<T>} change"]
    vp_forms: []
    args: { c: "parts<T>", xs: "list<term<T>>" }
    lean: "Frames.ChangesOnly {op} {c} {xs}"
    at: "Frames.ChangesOnly.at {op} {c} {xs}"
    check: "Frames.Check.changesOnly {op} {c} {xs}"
    defs: [Frames.ChangesOnly, Frames.ChangesOnly.at, Frames.Op.HoldsAt]
    flat: "{c'} = {c} ∧ ∀ k ∈ {c}, k ∉ {xs} → {pm'} = {pm}"
    echo: "{c} are the same after the call, and every one of them other than {xs} has the {part} it had before"
    defaults: [D3]
  - id: always
    kind: frame
    number: 4
    cat: claim
    then_forms: ["{c:class}"]
    vp_forms: ["is always accepted"]
    retired: [{ in: vp_forms, was: "always succeeds", now: "is always accepted" }]
    implied: { c: accepted }
    lean: "Frames.Always {op} {c}"
    at: "Frames.Always.at {op} {c}"
    check: "Frames.Check.always {op} {c}"
    defs: [Frames.Always, Frames.Always.at, Frames.Op.HoldsAt]
    flat: "{c}"
    echo: "{c}"
  - id: never
    kind: frame
    number: 4
    cat: claim
    then_forms: []                  # reached through the `not_forms` of a class ("it is rejected", "there is no result")
    vp_forms: ["is always rejected"]
    retired: [{ in: vp_forms, was: "is never accepted", now: "is always rejected" }]
    implied: { c: accepted }
    args: { c: class }
    lean: "Frames.Never {op} {c}"
    at: "Frames.Never.at {op} {c}"
    check: "Frames.Check.never {op} {c}"
    defs: [Frames.Never, Frames.Never.at, Frames.Op.HoldsAt]
    flat: "¬ ({c})"
    echo: "it is NOT the case that {c}"
  - id: if_then
    kind: frame
    number: 5
    cat: claim
    then_forms: []
    vp_forms: ["is accepted whenever {k:cond}"]
    implied: { c: accepted }
    lean: "Frames.IfThen {op} {k} {c}"
    at: "Frames.IfThen.at {op} {k} {c}"
    check: "Frames.Check.ifThen {op} {k} {c}"
    defs: [Frames.IfThen, Frames.IfThen.at, Frames.Op.HoldsAt]
    flat: "({k}) → {c}"
    echo: "if {k}, then {c} (and the call gives an answer whether or not {k})"
  - id: only_if
    kind: frame
    number: 6
    cat: claim
    then_forms: []
    vp_forms: ["is accepted only if {k:cond}"]
    implied: { c: accepted }
    lean: "Frames.OnlyIf {op} {c} {k}"
    at: "Frames.OnlyIf.at {op} {c} {k}"
    check: "Frames.Check.onlyIf {op} {c} {k}"
    defs: [Frames.OnlyIf, Frames.OnlyIf.at, Frames.Op.HoldsAt]
    flat: "{c} → ({k})"
    echo: "{c} only if {k}"
  - id: exactly_when
    kind: frame
    number: 7
    cat: claim
    then_forms: []
    vp_forms: ["is accepted exactly when {k:cond}"]
    implied: { c: accepted }
    lean: "Frames.ExactlyWhen {op} {c} {k}"
    at: "Frames.ExactlyWhen.at {op} {c} {k}"
    check: "Frames.Check.exactlyWhen {op} {c} {k}"
    defs: [Frames.ExactlyWhen, Frames.ExactlyWhen.at, Frames.Op.HoldsAt]
    flat: "{c} ↔ ({k})"
    echo: "{c} if and only if {k}"
  - id: rejected_unchanged
    kind: frame
    number: 8
    cat: claim
    then_forms: ["it is rejected and changes nothing"]
    retired: [{ in: then_forms, was: "it is rejected and nothing is changed", now: "it is rejected and changes nothing" }]
    vp_forms: ["is rejected and changes nothing"]
    lean: "Frames.RejectedUnchanged {op}"
    at: "Frames.RejectedUnchanged.at {op}"
    check: "Frames.Check.rejectedUnchanged {op}"
    defs: [Frames.RejectedUnchanged, Frames.RejectedUnchanged.at, Frames.Op.HoldsAt]
    flat: "¬ ({accepted}) ∧ st' = st"
    echo: "the answer is a rejection, and the whole state after the call is the state before it"
    defaults: [D3]
  - id: increases_by
    kind: frame
    number: 9
    cat: claim
    then_forms: ["{m:measure<num>} is increased by exactly {t:term<num>}"]
    retired: [{ in: then_forms, was: "{m:measure<num>} is increased by {t:term<num>}", now: "{m:measure<num>} is increased by exactly {t:term<num>}" }]
    vp_forms: ["increases {m:measure<num>} by exactly {t:term<num>}"]
    lean: "Frames.IncreasesBy {op} {m} {t}"
    at: "Frames.IncreasesBy.at {op} {m} {t}"
    check: "Frames.Check.increasesBy {op} {m} {t}"
    defs: [Frames.IncreasesBy, Frames.IncreasesBy.at, Frames.Op.HoldsAt]
    flat: "{m'} = {m} + {t}"
    echo: "{m} after the call equals {m} before it plus {t}, exactly"
    defaults: [D3]
  - id: decreases_by
    kind: frame
    number: 9
    cat: claim
    then_forms: ["{m:measure<num>} is decreased by exactly {t:term<num>}"]
    retired: [{ in: then_forms, was: "{m:measure<num>} is decreased by {t:term<num>}", now: "{m:measure<num>} is decreased by exactly {t:term<num>}" }]
    vp_forms: ["decreases {m:measure<num>} by exactly {t:term<num>}"]
    lean: "Frames.DecreasesBy {op} {m} {t}"
    at: "Frames.DecreasesBy.at {op} {m} {t}"
    check: "Frames.Check.decreasesBy {op} {m} {t}"
    defs: [Frames.DecreasesBy, Frames.DecreasesBy.at, Frames.Op.HoldsAt]
    flat: "{m'} + {t} = {m}"
    echo: "{m} after the call, plus {t}, equals {m} before it, exactly"
    defaults: [D3]
  - id: becomes
    kind: frame
    number: 9
    cat: claim
    then_forms: ["{m:measure<T>} is now {t:term<T>}"]
    vp_forms: []
    lean: "Frames.Becomes {op} {m} {t}"
    at: "Frames.Becomes.at {op} {m} {t}"
    check: "Frames.Check.becomes {op} {m} {t}"
    defs: [Frames.Becomes, Frames.Becomes.at, Frames.Op.HoldsAt]
    flat: "{m'} = {t}"
    echo: "{m} after the call is {t}"
  - id: result_is
    kind: frame
    number: 9
    cat: claim
    then_forms: ["{a:ameasure<T>} is {t:term<T>}"]
    vp_forms: []
    lean: "Frames.ResultIs {op} {a} {t}"
    at: "Frames.ResultIs.at {op} {a} {t}"
    check: "Frames.Check.resultIs {op} {a} {t}"
    defs: [Frames.ResultIs, Frames.ResultIs.at, Frames.Op.HoldsAt]
    flat: "{a} = {t}"
    echo: "{a} is {t}"
  - id: result_at_most
    kind: frame
    number: 10
    cat: claim
    then_forms: ["{a:ameasure<num>} is at most {t:term<num>}"]
    vp_forms: []
    lean: "Frames.ResultAtMost {op} {a} {t}"
    at: "Frames.ResultAtMost.at {op} {a} {t}"
    check: "Frames.Check.resultAtMost {op} {a} {t}"
    defs: [Frames.ResultAtMost, Frames.ResultAtMost.at, Frames.Op.HoldsAt]
    flat: "{a} ≤ {t}"
    echo: "{a} is at most {t}"
  - id: result_at_least
    kind: frame
    number: 10
    cat: claim
    then_forms: ["{a:ameasure<num>} is at least {t:term<num>}"]
    vp_forms: []
    lean: "Frames.ResultAtLeast {op} {a} {t}"
    at: "Frames.ResultAtLeast.at {op} {a} {t}"
    check: "Frames.Check.resultAtLeast {op} {a} {t}"
    defs: [Frames.ResultAtLeast, Frames.ResultAtLeast.at, Frames.Op.HoldsAt]
    flat: "{t} ≤ {a}"
    echo: "{a} is at least {t}"
  - id: at_most
    kind: frame
    number: 10
    cat: claim
    then_forms: ["{m:measure<num>} is afterwards at most {t:term<num>}"]
    vp_forms: ["never leaves {m:measure<num>} above {t:term<num>}"]
    lean: "Frames.AtMost {op} {m} {t}"
    at: "Frames.AtMost.at {op} {m} {t}"
    check: "Frames.Check.atMost {op} {m} {t}"
    defs: [Frames.AtMost, Frames.AtMost.at, Frames.Op.HoldsAt]
    flat: "{m'} ≤ {t}"
    echo: "{m} after the call is at most {t}"
  - id: at_least
    kind: frame
    number: 10
    cat: claim
    then_forms: ["{m:measure<num>} is afterwards at least {t:term<num>}"]
    vp_forms: ["never leaves {m:measure<num>} below {t:term<num>}"]
    lean: "Frames.AtLeast {op} {m} {t}"
    at: "Frames.AtLeast.at {op} {m} {t}"
    check: "Frames.Check.atLeast {op} {m} {t}"
    defs: [Frames.AtLeast, Frames.AtLeast.at, Frames.Op.HoldsAt]
    flat: "{t} ≤ {m'}"
    echo: "{m} after the call is at least {t}"
  - id: every_of
    kind: frame
    number: 11
    cat: claim
    then_forms: ["every {c:acoll<T>} {p:itempred<T>} afterwards"]
    vp_forms: []
    negated: { p: none_of }         # "every X is not P afterwards" is refused: the book has one sentence for it, the form of `none_of`
    lean: "Frames.EveryOf {op} {c} {p}"
    at: "Frames.EveryOf.at {op} {c} {p}"
    check: "Frames.Check.everyOf {op} {c} {p}"
    defs: [Frames.EveryOf, Frames.EveryOf.at, Frames.Op.HoldsAt]
    flat: "∀ x ∈ {c'}, {p'}"
    echo: "every {c} {p}, judged on the state after the call"
    defaults: [D7]
  - id: none_of
    kind: frame
    number: 11
    cat: claim
    then_forms: ["no {c:acoll<T>} {p:itempred<T>} afterwards"]
    vp_forms: []
    lean: "Frames.NoneOf {op} {c} {p}"
    at: "Frames.NoneOf.at {op} {c} {p}"
    check: "Frames.Check.noneOf {op} {c} {p}"
    defs: [Frames.NoneOf, Frames.NoneOf.at, Frames.Op.HoldsAt]
    flat: "∀ x ∈ {c'}, ¬ ({p'})"
    echo: "no {c} {p}, judged on the state after the call"
    defaults: [D7]
  - id: monotone
    kind: frame
    number: 12
    runs: 2
    cat: claim
    then_forms: []
    vp_forms: ["never loses acceptance when {v:variation}", "never loses that {c:class} when {v:variation}"]
    implied: { c: accepted }
    implied_only: true              # "never loses that it is accepted" (a class that says `same_as: accepted`) is refused: write "never loses acceptance"
    args: { v: variation, c: class }
    lean: "Frames.Monotone {op} {v} {c}"
    at: "Frames.Monotone.at {op} {v} {c}"
    check: "Frames.Check.monotone {op} {v} {c}"
    defs: [Frames.Monotone, Frames.Monotone.at, Frames.Op.HoldsAt2]
    flat: "{c} → {c2}"
    echo: "whenever {v}, and for the first call {c}, then for the second call too {c}"
    defaults: [D10]
  - id: agrees_with
    kind: frame
    number: 13
    cat: claim
    then_forms: []
    vp_forms: ["agrees with {r:reference}"]
    lean: "Frames.AgreesWith {op} {r}"
    at: "Frames.AgreesWith.at {op} {r}"
    check: "Frames.Check.agreesWith {op} {r}"
    defs: [Frames.AgreesWith, Frames.AgreesWith.at, Frames.Op.HoldsAt]
    flat: "(ans, st') = {r} st inp"
    echo: "the answer and the state after the call are exactly what {r} gives for the state before and the input"
  - id: same_answer
    kind: frame
    number: 14
    runs: 2
    cat: claim
    then_forms: []
    vp_forms: ["gives the same answer when {v:variation}"]
    lean: "Frames.IndependentOf {op} {v} (fun ans _ => ans)"
    at: "Frames.IndependentOf.at {op} {v} (fun ans _ => ans)"
    check: "Frames.Check.independentOf {op} {v} (fun ans _ => ans)"
    defs: [Frames.IndependentOf, Frames.IndependentOf.at, Frames.Op.HoldsAt2]
    flat: "ans = ans2"
    echo: "whenever {v}, the two calls give the same answer"
    defaults: [D10]
  - id: within
    kind: frame
    number: 15
    cat: claim
    then_forms: ["every {c:acoll<T>} is a {d:coll<T>}"]
    vp_forms: []
    lean: "Frames.Within {op} {c} {d}"
    at: "Frames.Within.at {op} {c} {d}"
    check: "Frames.Check.within {op} {c} {d}"
    defs: [Frames.Within, Frames.Within.at, Frames.Op.HoldsAt]
    flat: "∀ x ∈ {c'}, x ∈ {d}"
    echo: "every {c} is a {d} (the first is read off the answer, the second off the input before the call)"
  - id: covers
    kind: frame
    number: 15
    cat: claim
    then_forms: ["every {d:coll<T>} is a {c:acoll<T>}"]
    vp_forms: []
    lean: "Frames.Covers {op} {c} {d}"
    at: "Frames.Covers.at {op} {c} {d}"
    check: "Frames.Check.covers {op} {c} {d}"
    defs: [Frames.Covers, Frames.Covers.at, Frames.Op.HoldsAt]
    flat: "∀ x ∈ {d}, x ∈ {c'}"
    echo: "every {d} is a {c} (the first is read off the input before the call, the second off the answer)"
  - id: same_answer_if
    kind: frame
    number: 16
    runs: 2
    cat: claim
    then_forms: []
    vp_forms: ["gives the same answer when {v:variation}, if {c:class@first}"]      # "..., if the first call is rejected"
    args: { v: variation, c: class }
    retired: [{ in: vp_forms, was: "gives the same answer when {v:variation}, if {c:class}", now: "gives the same answer when {v:variation}, if {c:class@first}" }]
    lean: "Frames.IndependentGiven {op} {v} {c} (fun ans _ => ans)"
    at: "Frames.IndependentGiven.at {op} {v} {c} (fun ans _ => ans)"
    check: "Frames.Check.independentGiven {op} {v} {c} (fun ans _ => ans)"
    defs: [Frames.IndependentGiven, Frames.IndependentGiven.at, Frames.Op.HoldsAt2]
    flat: "{c} → ans = ans2"
    echo: "whenever {v}, and for the first call {c}, the two calls give the same answer"
    defaults: [D10]

# ---------------------------------------------------------------------------------------------- grammar
# THE SHAPE OF A RULE LINE (plan node Q3). The words that put a Rule line together and belong to no one piece: the
# article of the subject, the two voices, the joining of clauses and of claims, how a role of the operation is named.
# The compiler reads them from here; it holds no surface form of its own. Entries of the book like any other: signed by
# id, under the digest, listed among the pieces of every reading that was read through them.
#   {subject} an operation noun with its article and its modifiers (the `subject_forms` of the modifiers above)
#   {vp}      a Rule verb phrase (`vp_forms`);    {claim}  what a Then says (`then_forms`, `claim_forms`)
#   {clause}  "<subject> <vp>" or "for <subject>, <claim>";    {role}  a role name of the operation (`state:`, `input:`)
# (The steps of a scenario are Gherkin's: Given = a condition, When = an operation's `when` form, Then = a claim.)
grammar:
  - id: g.subject
    forms: ["a {op}", "an {op}"]
    retired: [{ in: forms, was: "every {op}", now: "a {op}" }, { in: forms, was: "any {op}", now: "a {op}" }]
    echo: "every call of the operation (with every state and every input)"
  - id: g.role
    forms: ["the {role}"]
    echo: "the part of the state, or the input, that the operation gives that role"
  - id: g.rule_vp
    forms: ["{subject} {vp}"]
    echo: "what the Rule says of its subject"
  - id: g.rule_for
    forms: ["for {subject}, {claim}"]
    reads: no_verb_phrase               # {claim} is a Then form of a frame that has no verb phrase with the same holes (one voice per frame)
    narrowing: on_subject               # no `claim_forms` prefix is read before {claim}: a Rule line narrows on its subject
    echo: "what a Then would say, said of the subject"
  - id: g.claims
    forms: ["{claim} and {claim}"]
    echo: "each claim is made of the same subject"
  - id: g.clauses
    forms: ["{clause}, and {clause}"]
    echo: "each clause is a rule of its own, with its own subject"
  - id: g.line
    forms: ["{line}"]
    first_letter_either_case: true      # "A <operation> ..." and "a <operation> ..." are the same line
    final_full_stop_optional: true      # a line ending in "." and the same line without it are the same line
    echo: "the Rule line as written, up to the case of its first letter and a final full stop"

# FRAMES DEFINED IN LEAN WITH NO SURFACE FORM YET. Each has a definition, an executable second reading and
# a comparison of the two on generated inputs (lean/Run/FrameTests.lean); it is not reachable from a sentence.
# (Monotone, agrees-with and independent-of had no surface until the domain-word kinds `variation` and `reference`
# were added; they are frames 12 to 14 above, with frames 15 and 16.)
frames_without_surface:
  - { id: count_of, number: 11, lean: Frames.CountOf, check: Frames.Check.countOf,
      echo: "at most / at least / exactly n {c} {p}, judged on the state after the call" }
